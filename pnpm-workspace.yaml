packages:
  - apps/*
  - packages/*

# One version per dependency for the whole monorepo. Use "catalog:" in package.json.
catalog:
  "@eslint/js": ^10.0.1
  "@fontsource/barlow-condensed": ^5.3.0
  "@fontsource/inter": ^5.3.0
  "@playwright/test": ^1.64.1
  "@tanstack/react-query": ^5.104.5
  "@testing-library/dom": ^10.4.2
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.3
  "@types/cors": ^2.8.19
  "@types/express": ^5.0.6
  "@types/node": ^24.19.2
  "@types/pg": ^8.23.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/supertest": ^7.2.1
  "@vitejs/plugin-react": ^6.1.2
  cors: ^2.8.6
  date-fns: ^4.4.0
  date-fns-tz: ^3.2.0
  dotenv: ^18.0.9
  eslint: ^10.13.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.1
  express: ^5.3.0
  globals: ^17.13.0
  helmet: ^8.3.0
  jsdom: ^30.1.3
  kysely: ^0.29.7
  kysely-codegen: ^0.20.0
  pg: ^8.23.1
  pino: ^10.4.0
  pino-http: ^11.0.0
  pino-pretty: ^13.2.0
  prettier: ^3.9.10
  react: ^19.3.1
  react-dom: ^19.3.1
  react-router: ^8.5.0
  supertest: ^7.3.1
  tsup: ^9.0.0
  tsx: ^4.23.15
  # typescript-eslint supports TypeScript < 6.1, so TypeScript 7 is not usable yet.
  typescript: ~6.0.3
  typescript-eslint: ^8.72.0
  vite: ^8.3.5
  vitest: ^5.0.5
  zod: ^4.6.7

# Dependencies allowed to run install scripts (pnpm blocks them by default).
allowBuilds:
  esbuild: true
