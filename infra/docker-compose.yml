name: voita_kone

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: voita
      POSTGRES_PASSWORD: voita
      POSTGRES_DB: voita_kone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voita -d voita_kone"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.32
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  postgres_data:
